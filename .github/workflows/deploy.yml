name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Patch next.config for static export
        run: |
          cat > next.config.ts << 'EOF'
          import type { NextConfig } from "next";

          // Configuração para GitHub Pages (export estático)
          // Para o repositório https://<user>.github.io/<repo> ajuste basePath
          const repo = process.env.GITHUB_REPOSITORY?.split('/')[1] || '';
          const isUserRepo = process.env.GITHUB_REPOSITORY?.split('/')[0] === 'github.io';
          const basePath = isUserRepo ? '' : (repo ? `/${repo}` : '');

          const nextConfig: NextConfig = {
            output: "export",
            reactStrictMode: false,
            images: { unoptimized: true },
            trailingSlash: true,
            ...(basePath ? { basePath, assetPrefix: basePath + '/' } : {}),
            typescript: { ignoreBuildErrors: true },
            eslint: { ignoreDuringBuilds: true },
          };

          export default nextConfig;
          EOF

      - name: Build
        run: bun run next build

      - name: Add .nojekyll
        run: touch ./out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
