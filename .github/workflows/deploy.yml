name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Configure Next.js for static export
        run: |
          cat > next.config.ts << 'EOF'
          import type { NextConfig } from "next";

          // Repo name — detecta automaticamente o basePath correto
          // Ex: se repo = superaplicativos/aischoll → basePath = "/aischoll"
          // Ex: se repo = user/user.github.io → basePath = "" (root)
          const repo = process.env.GITHUB_REPOSITORY?.split('/')[1] || '';
          const owner = process.env.GITHUB_REPOSITORY?.split('/')[0] || '';
          const isUserPages = repo === `${owner}.github.io`;
          const basePath = isUserPages ? '' : (repo ? `/${repo}` : '');

          const nextConfig: NextConfig = {
            output: "export",
            reactStrictMode: false,
            images: { unoptimized: true },
            trailingSlash: true,
            typescript: { ignoreBuildErrors: true },
            eslint: { ignoreDuringBuilds: true },
            ...(basePath ? { basePath, assetPrefix: basePath + '/' } : {}),
          };

          export default nextConfig;
          EOF
          echo "✅ next.config.ts gerado para repo: ${{ github.repository }}"

      - name: Build static export
        run: bun next build

      - name: Add .nojekyll (disable Jekyll processing)
        run: touch ./out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
